name: Build Android APK Direct

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip project files
        run: |
          [ -f android.zip ] && unzip -o android.zip -d .
          [ -f src.zip ] && unzip -o src.zip -d .
          [ -f supabase.zip ] && unzip -o supabase.zip -d .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Sync Capacitor
        run: |
          npm ci || npm install
          npm run build --if-present
          npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SleepAlarm-APK
          path: '**/app-debug.apk'
