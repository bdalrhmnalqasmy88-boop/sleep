name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore project folders from ZIP
        run: |
          set -e

          echo "Extracting android.zip..."
          unzip -o android.zip -d .

          echo "Extracting src.zip..."
          unzip -o src.zip -d .

          if [ -f supabase.zip ]; then
            echo "Extracting supabase.zip..."
            unzip -o supabase.zip -d .
          fi

          echo "Checking project structure..."
          echo "Root:"
          ls -la

          echo "Android:"
          ls -la android

          echo "Source:"
          ls -la src || true

          echo "Checking required files..."

          test -f package.json
          test -d android
          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -d src

          echo "All required files found."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Build Web App
        run: |
          npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SleepAlarm-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
